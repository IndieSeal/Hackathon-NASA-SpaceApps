services:
  db:
    image: postgres:16-alpine
    container_name: aerospace_health_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aerospace_health}
      POSTGRES_USER: ${POSTGRES_USER:-aerospace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aerospace_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aerospace_health_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aerospace} -d ${POSTGRES_DB:-aerospace_health}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: aerospace_health_adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  aerospace_health_pgdata:
